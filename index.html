<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f4f1e8" />
  <title>Unity-chan Action TD — Web Preview</title>
  <link rel="icon" href="TemplateData/favicon.ico" />
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #f4f1e8; color: #20201d; }
    body { min-height: 100dvh; display: flex; flex-direction: column; }
    header { min-height: 52px; display: flex; align-items: center; gap: 16px; padding: 8px 14px; border-bottom: 1px solid rgba(32,32,29,.14); background: rgba(250,248,242,.96); }
    .title { font-weight: 700; white-space: nowrap; }
    .controls { display: flex; flex-wrap: wrap; gap: 5px 10px; font-size: 12px; line-height: 1.3; opacity: .82; }
    kbd { font: inherit; font-weight: 700; padding: 1px 5px; border: 1px solid rgba(32,32,29,.24); border-radius: 5px; background: white; box-shadow: 0 1px 0 rgba(0,0,0,.07); }
    .spacer { flex: 1; }
    button { font: inherit; border: 1px solid rgba(32,32,29,.25); border-radius: 8px; background: white; padding: 7px 10px; cursor: pointer; }
    main { flex: 1; min-height: 0; display: grid; place-items: center; padding: 10px; }
    #game-shell { position: relative; width: min(100%, calc((100dvh - 72px) * 16 / 9)); aspect-ratio: 16 / 9; background: #1f1f20; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.16); }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1f1f20; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #1f1f20; color: white; z-index: 2; }
    #loading-inner { width: min(360px, 70%); text-align: center; }
    #progress-track { margin-top: 12px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
    #progress { width: 0; height: 100%; background: white; transition: width .1s linear; }
    #warning { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 4; pointer-events: none; }
    #warning > div { margin-bottom: 6px; padding: 8px 10px; border-radius: 7px; background: rgba(255,246,210,.96); color: #362b0e; font-size: 12px; }
    footer { padding: 3px 12px 9px; text-align: center; font-size: 11px; opacity: .58; }
    footer a { color: inherit; }
    #rotate { display:none; position: fixed; inset: 0; z-index: 20; place-items: center; text-align:center; padding: 28px; background:#f4f1e8; font-weight:700; }
    @media (pointer: coarse) {
      header, footer { display: none; }
      main { padding: 0; width: 100vw; height: 100dvh; }
      #game-shell { width: 100vw; height: 100dvh; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
      @media (orientation: portrait) { #rotate { display:grid; } }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Unity-chan Action TD</div>
    <div class="controls" aria-label="操作方法">
      <span><kbd>WASD</kbd> 移動</span><span><kbd>Space</kbd> Jump</span><span><kbd>J</kbd> Attack</span><span><kbd>K</kbd> Strong</span><span><kbd>L</kbd> Dodge</span><span><kbd>Q</kbd> Special</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Support</span><span><kbd>R</kbd> Replay</span>
    </div>
    <div class="spacer"></div>
    <button id="fullscreen" type="button">全画面</button>
  </header>
  <main>
    <div id="game-shell">
      <canvas id="unity-canvas" tabindex="0"></canvas>
      <div id="loading"><div id="loading-inner"><div>Loading WebGL preview…</div><div id="progress-track"><div id="progress"></div></div></div></div>
      <div id="warning"></div>
    </div>
  </main>
  <footer>source revision <code>cf3b95c</code> · <a href="THIRD_PARTY_NOTICES.md">third-party notices</a></footer>
  <div id="rotate">横向きにすると、タッチ操作でプレイできます。</div>
<script>
  const canvas = document.querySelector('#unity-canvas');
  const shell = document.querySelector('#game-shell');
  const loading = document.querySelector('#loading');
  const progress = document.querySelector('#progress');
  const warning = document.querySelector('#warning');
  const buildUrl = 'Build';
  const config = {
    arguments: [],
    dataUrl: buildUrl + '/WebGLPages.data.unityweb',
    frameworkUrl: buildUrl + '/WebGLPages.framework.js.unityweb',
    codeUrl: buildUrl + '/WebGLPages.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'kikutadev',
    productName: 'Unity-chan Action TD Web Preview',
    productVersion: 'preview-cf3b95c',
    showBanner: (msg, type) => {
      const item = document.createElement('div');
      item.textContent = msg;
      if (type === 'error') item.style.background = 'rgba(255,218,218,.97)';
      warning.appendChild(item);
      if (type !== 'error') setTimeout(() => item.remove(), 5000);
    }
  };
  if (matchMedia('(pointer: coarse)').matches) config.devicePixelRatio = 1;
  const loader = document.createElement('script');
  loader.src = buildUrl + '/WebGLPages.loader.js';
  loader.onload = () => createUnityInstance(canvas, config, p => progress.style.width = `${Math.round(p * 100)}%`)
    .then(instance => {
      loading.remove();
      canvas.focus();
      document.querySelector('#fullscreen').onclick = () => instance.SetFullscreen(1);
      shell.addEventListener('pointerdown', () => canvas.focus(), { passive: true });
      window.__unityInstance = instance;
      document.documentElement.dataset.unityReady = 'true';
    })
    .catch(err => {
      loading.querySelector('#loading-inner').textContent = `起動に失敗しました: ${err}`;
      document.documentElement.dataset.unityReady = 'false';
      console.error(err);
    });
  loader.onerror = () => { loading.querySelector('#loading-inner').textContent = 'Unity loaderを読み込めませんでした。'; };
  document.body.appendChild(loader);
</script>
</body>
</html>
